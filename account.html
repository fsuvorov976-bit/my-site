<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Интернет-магазин</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .switch-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .switch-text a {
            color: #3498db;
            text-decoration: none;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #333;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <!-- Блок сообщений -->
    <div id="alertMessage" class="message hidden"></div>

    <!-- 1. ФОРМА ВХОДА -->
    <div id="loginFormSection">
        <h2>Вход в аккаунт</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <input type="password" id="loginPassword" required placeholder="********">
            </div>
            <button type="submit">Войти</button>
        </form>
        <div class="switch-text">
            Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a>
        </div>
    </div>

    <!-- 2. ФОРМА РЕГИСТРАЦИИ -->
    <div id="registerFormSection" class="hidden">
        <h2>Регистрация</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" required placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label for="regPassword">Пароль</label>
                <input type="password" id="regPassword" required placeholder="********">
            </div>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div class="switch-text">
            Уже есть аккаунт? <a href="#" id="showLogin">Войти</a>
        </div>
    </div>

    <!-- 3. ФОРМА ВВОДА КОДА ПОДТВЕРЖДЕНИЯ -->
    <div id="verifyFormSection" class="hidden">
        <h2>Подтверждение Email</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 15px; text-align: center;">
            Мы отправили 6-значный код подтверждения на ваш email. Введите его ниже:
        </p>
        <form id="verifyForm">
            <div class="form-group">
                <label for="verifyCode">Код подтверждения</label>
                <input type="text" id="verifyCode" required placeholder="123456" maxlength="6" style="text-align: center; letter-spacing: 5px; font-size: 20px;">
            </div>
            <button type="submit">Подтвердить</button>
        </form>
    </div>

    <!-- 4. ЛИЧНЫЙ КАБИНЕТ (ЕСЛИ АВТОРИЗОВАН) -->
    <div id="profileSection" class="hidden">
        <h2>Личный кабинет</h2>
        <p style="margin-bottom: 20px; text-align: center;">Вы вошли как: <br><strong id="userEmailDisplay" style="color: #3498db;"></strong></p>
        <button id="logoutBtn" style="background-color: #e74c3c;">Выйти из аккаунта</button>
    </div>

    <a href="index.html" class="back-home">← Вернуться на главную</a>
</div>

<script>
    // ⚠️ ЗАМЕНИТЕ ЭТУ СТРОКУ НА РЕАЛЬНЫЙ URL ВАШЕГО СЕРВЕРА НА RENDER (без слэша на конце)
    const API_URL = 'https://your-app-name.onrender.com';

    // Элементы интерфейса
    const loginFormSection = document.getElementById('loginFormSection');
    const registerFormSection = document.getElementById('registerFormSection');
    const verifyFormSection = document.getElementById('verifyFormSection');
    const profileSection = document.getElementById('profileSection');

    const showRegisterLink = document.getElementById('showRegister');
    const showLoginLink = document.getElementById('showLogin');

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const verifyForm = document.getElementById('verifyForm');
    const logoutBtn = document.getElementById('logoutBtn');

    const alertMessage = document.getElementById('alertMessage');
    const userEmailDisplay = document.getElementById('userEmailDisplay');

    let registeredEmail = ''; // Сохраняем email для этапа проверки кода

    // Функция показа уведомлений
    function showAlert(text, type = 'error') {
        alertMessage.textContent = text;
        alertMessage.className = `message ${type}`;
        alertMessage.classList.remove('hidden');
    }

    function hideAlert() {
        alertMessage.classList.add('hidden');
    }

    // Переключение между формами
    showRegisterLink.addEventListener('click', (e) => {
        e.preventDefault();
        hideAlert();
        loginFormSection.classList.add('hidden');
        registerFormSection.classList.remove('hidden');
    });

    showLoginLink.addEventListener('click', (e) => {
        e.preventDefault();
        hideAlert();
        registerFormSection.classList.add('hidden');
        loginFormSection.classList.remove('hidden');
    });

    // Проверка при загрузке страницы: авторизован ли пользователь?
    const savedUser = localStorage.getItem('user');
    if (savedUser) {
        showProfile(JSON.parse(savedUser).email);
    }

    function showProfile(email) {
        loginFormSection.classList.add('hidden');
        registerFormSection.classList.add('hidden');
        verifyFormSection.classList.add('hidden');
        profileSection.classList.remove('hidden');
        userEmailDisplay.textContent = email;
    }

    // 1. Обработка регистрации
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        try {
            const response = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                registeredEmail = email; // Запоминаем email
                registerFormSection.classList.add('hidden');
                verifyFormSection.classList.remove('hidden');
                showAlert(data.message, 'success');
            } else {
                showAlert(data.error || 'Ошибка регистрации');
            }
        } catch (err) {
            showAlert('Ошибка соединения с сервером');
        }
    });

    // 2. Обработка проверки кода
    verifyForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const code = document.getElementById('verifyCode').value;

        try {
            const response = await fetch(`${API_URL}/api/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: registeredEmail, code })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('user', JSON.stringify(data.user));
                showProfile(data.user.email);
                showAlert('Аккаунт успешно подтвержден!', 'success');
            } else {
                showAlert(data.error || 'Неверный код');
            }
        } catch (err) {
            showAlert('Ошибка соединения с сервером');
        }
    });

    // 3. Обработка входа
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const response = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('user', JSON.stringify(data.user));
                showProfile(data.user.email);
            } else {
                showAlert(data.error || 'Неверный email или пароль');
            }
        } catch (err) {
            showAlert('Ошибка соединения с сервером');
        }
    });

    // Выход из аккаунта
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('user');
        profileSection.classList.add('hidden');
        loginFormSection.classList.remove('hidden');
        document.getElementById('loginForm').reset();
        hideAlert();
    });
</script>
</body>
</html>
