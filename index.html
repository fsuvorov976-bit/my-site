<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Alter-shop Clone</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        header { background: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ddd; }
        .container { display: flex; padding: 20px; }
        aside { width: 250px; background: #fff; padding: 15px; margin-right: 20px; }
        main { flex-grow: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .product-card { background: #fff; padding: 15px; border: 1px solid #ddd; text-align: center; }
        .buy-btn { background: #ff9900; color: white; border: none; padding: 10px; cursor: pointer; width: 100%; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<header>
    <div><strong>Alter-shop Clone</strong></div>
    <input type="text" placeholder="Пошук товарів...">
    <div><a href="account.html">Кабінет</a> | <a href="#">Кошик</a></div>
</header>
<div class="container">
    <aside>
        <h3>Каталог</h3>
        <ul>
            <li>Kludi</li>
            <li>PAFFONI</li>
            <li>NOBILI</li>
        </ul>
    </aside>
    <main id="product-list">
        <!-- Product cards will be injected here -->
    </main>
</div>
<script src="js/catalog.js"></script>
</body>
</html>
